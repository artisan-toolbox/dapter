name: backend databases

on:
  push:
    branches:
      - 1.x
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'latest' || github.sha }}
  cancel-in-progress: true

jobs:
  native-backends:
    name: native-backends${{ matrix.php == '8.6' && ' / PHP 8.6' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.6']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: dapter_native_ci
          MYSQL_ROOT_PASSWORD: dapter_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pdapter_test_password"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_DB: dapter_native_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dapter_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d dapter_native_ci"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      DAPTER_MYSQL_DATABASE: dapter_native_ci
      DAPTER_MYSQL_USERNAME: root
      DAPTER_MYSQL_PASSWORD: dapter_test_password
      DAPTER_PGSQL_DATABASE: dapter_native_ci
      DAPTER_PGSQL_USERNAME: postgres
      DAPTER_PGSQL_PASSWORD: dapter_test_password
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up CI dependencies
        uses: artisan-toolbox/maintainer@c46eefa9d82cdfcd53c83c06c810ca2d3b0c7c33 # 1.14.4
        with:
          php-version: ${{ matrix.php }}
          php-extensions: dom, curl, libxml, mbstring, zip, fileinfo, pdo_sqlite, pdo_mysql, pdo_pgsql, bcmath, intl
          php-ini-values: memory_limit=128M
          composer-mode: prefer-stable
          composer-scripts: 'false'
      - name: Discover Testbench packages
        run: composer run prepare
      - name: Verify shared HTTP behavior on every backend
        run: |
          PGPASSWORD="$DAPTER_PGSQL_PASSWORD" psql -h 127.0.0.1 -U "$DAPTER_PGSQL_USERNAME" -d "$DAPTER_PGSQL_DATABASE" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector'
          php vendor/bin/pest --configuration=phpunit.native.xml.dist
