name: tests

on:
  push:
    branches:
      - 1.x
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.5]
        laravel: [13.*]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install lowest supported direct frontend dependencies
        if: matrix.stability == 'prefer-lowest'
        run: npm install --no-save --package-lock=false --ignore-scripts @types/node@24.13.3 typescript@5.8.3 vite-plus@1.6.0 vue-tsc@3.3.14 @inertiajs/core@3.0.3 @inertiajs/vue3@3.0.3 @vitejs/plugin-vue@6.0.0 vue@3.5.40 ziggy-js@2.6.5 vite@npm:@voidzero-dev/vite-plus-core@1.6.0

      - name: Run configured quality checks
        run: php vendor/bin/maintainer quality:check --no-interaction

      - name: Verify PHP type coverage
        run: composer test:types

      - name: Verify frontend type tests
        run: npm run test:types

      - name: Build and verify the library distribution
        run: |
          npm run build
          npm run build:consumer
          npm run check:dist

      - name: Verify the Composer distribution
        run: composer distribution:check

      - name: Verify contributor standards
        run: npm run standards:check
