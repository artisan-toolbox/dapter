name: tests

on:
  push:
    branches:
      - 1.x
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.5]
        stability: [prefer-lowest, prefer-stable]

    name: P${{ matrix.php }} - L13.* - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up CI tools
        uses: artisan-toolbox/maintainer@498f5f8723cbed3d24af0ba90870ca26010db4df # 1.14.2
        with:
          php-version: ${{ matrix.php }}
          php-extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
          php-ini-values: error_reporting=E_ALL, memory_limit=128M
          composer-mode: none
          composer-validation: no-check-lock
          node-version: '24'
          npm-cache: 'true'
          npm-install: 'false'

      - name: Verify the Git distribution before installing dependencies
        shell: bash
        run: |
          git archive --format=zip --output="$RUNNER_TEMP/dapter-git.zip" HEAD
          php scripts/check-composer-distribution.php "$RUNNER_TEMP/dapter-git.zip"

      - name: Resolve and install PHP dependencies
        shell: bash
        env:
          COMPOSER_RESOLUTION: ${{ matrix.stability }}
        run: composer update "--$COMPOSER_RESOLUTION" --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Discover Testbench packages
        run: composer run prepare

      - name: Verify contributor standards
        run: npm run standards:check

      - name: Install frontend dependencies
        run: npm ci

      - name: Install lowest supported direct frontend dependencies
        if: matrix.stability == 'prefer-lowest'
        run: npm install --no-save --package-lock=false --ignore-scripts @types/node@24.13.3 typescript@5.8.3 vite-plus@1.6.0 vue-tsc@3.3.14 @inertiajs/core@3.0.3 @inertiajs/vue3@3.0.3 @vitejs/plugin-vue@6.0.0 vue@3.5.40 ziggy-js@2.6.5 vite@npm:@voidzero-dev/vite-plus-core@1.6.0

      - name: Analyse PHP
        run: composer analyse

      - name: Check PHP formatting
        run: composer lint:check

      - name: Verify PHP type coverage
        run: composer test:types

      - name: Run Pest tests
        run: composer test:unit

      - name: Check frontend formatting, lint, and Vue types
        run: npm run check

      - name: Run frontend runtime and type tests
        run: npm test

      - name: Build the library distribution
        run: npm run build

      - name: Build the frontend consumer
        run: npm run build:consumer

      - name: Verify the npm distribution
        run: npm run check:dist

      - name: Compare rebuilt files with the Git distribution
        if: matrix.os == 'ubuntu-latest' && matrix.stability == 'prefer-stable'
        run: |
          unzip -q "$RUNNER_TEMP/dapter-git.zip" 'dist/*' -d "$RUNNER_TEMP/dapter-shipped"
          diff -qr "$RUNNER_TEMP/dapter-shipped/dist" dist

      - name: Verify the Composer distribution
        run: composer distribution:check
